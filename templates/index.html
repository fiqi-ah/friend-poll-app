
<!-- Frontend -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Party Poll</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- STEP 1: Name Join Modal -->
    <div id="join-card"
        class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full shadow-2xl text-center">
        <h1 class="text-3xl font-extrabold text-indigo-400 mb-2">🎉 Party Poll</h1>
        <p class="text-slate-400 text-sm mb-6">Enter your name to join your friends.</p>
        <input id="username-input" type="text" placeholder="Your nickname" maxlength="15"
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none text-white">
        <button onclick="joinRoom()"
            class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition">
            Enter Room
        </button>
    </div>

    <!-- STEP 2: Main Game Dashboard (Hidden initially) -->
    <div id="game-card"
        class="hidden bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-lg w-full shadow-2xl">

        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <span class="text-xs uppercase tracking-widest text-slate-500">Live Session</span>
            <span id="player-badge"
                class="text-xs bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded-full font-mono"></span>
        </div>

        <!-- Active Question -->
        <div class="mb-8 text-center">
            <span class="text-indigo-400 font-medium text-xs tracking-wider uppercase">Current Prompt</span>
            <h2 id="question-text" class="text-2xl font-bold mt-1 text-white leading-snug">Loading...</h2>
        </div>

        <!-- Player Voting Options -->
        <div class="mb-8">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">Vote for someone:</h3>
            <div id="players-list" class="space-y-2"></div>
        </div>

        <!-- Submit a New Question -->
        <div class="border-t border-slate-800 pt-5">
            <label class="text-xs text-slate-400 block mb-2 font-medium">Ask the next question:</label>
            <div class="flex gap-2">
                <input id="new-q-input" type="text" placeholder="Who is most likely to..."
                    class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="submitQuestion()"
                    class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition">
                    Ask
                </button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let myUsername = "";

        function joinRoom() {
            const input = document.getElementById("username-input");
            if (!input.value.trim()) return;
            myUsername = input.value.trim();

            // Open WebSocket connection (uses wss:// if hosted on HTTPS)
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            socket.onopen = () => {
                // Send nickname as handshake
                socket.send(JSON.stringify({ username: myUsername }));
                document.getElementById("join-card").classList.add("hidden");
                document.getElementById("game-card").classList.remove("hidden");
                document.getElementById("player-badge").innerText = `Logged in as: ${myUsername}`;
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "state_update") {
                    renderState(data);
                }
            };

            socket.onclose = () => {
                alert("Disconnected from server. Refresh to reconnect!");
            };
        }

       function renderState(state) {
  document.getElementById("question-text").innerText = state.question;
  const listContainer = document.getElementById("players-list");
  listContainer.innerHTML = "";

  const totalVotes = Object.values(state.votes).reduce((a, b) => a + b, 0);

  state.players.forEach(player => {
    const count = state.votes[player] || 0;
    const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

    const row = document.createElement("div");
    row.className = "relative overflow-hidden bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 flex justify-between items-center cursor-pointer hover:border-indigo-500 transition";
    row.onclick = () => vote(player);

    // Progress bar fill
    const bar = document.createElement("div");
    bar.className = "absolute left-0 top-0 bottom-0 bg-indigo-600/30 transition-all duration-300";
    bar.style.width = `${pct}%`;

    // Safe text injection (prevents XSS/formatting errors)
    const nameLabel = document.createElement("span");
    nameLabel.className = "relative z-10 font-medium text-slate-200";
    nameLabel.textContent = player;

    const countBadge = document.createElement("span");
    countBadge.className = "relative z-10 text-xs font-bold bg-slate-700/80 px-2 py-1 rounded text-slate-300";
    countBadge.textContent = `${count} (${pct}%)`;

    row.appendChild(bar);
    row.appendChild(nameLabel);
    row.appendChild(countBadge);
    listContainer.appendChild(row);
  });
}
         
    </script>
</body>

</html>
